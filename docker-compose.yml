services:
  postgres:
    image: postgres:15
    container_name: simtrader_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only — NOT exposed to the internet.
      # Host port 5433 (5432 is taken by another project on this VPS).
      # Reachable from the VPS host, so DBeaver can connect through an SSH tunnel.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: simtrader_backend
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      # No Caddy yet — expose on host so the app can hit http://<vps-ip>:4000.
      # When a domain + Caddy reverse proxy land, switch to "127.0.0.1:4000:4000".
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
